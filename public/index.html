<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playwright Automation Hub</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background-color: #f9f9f9; }
        h1 { text-align: center; color: #333; }
        .section { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        input[type="text"] { width: calc(100% - 22px); padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; color: white; font-weight: bold; }
        .btn-primary { background-color: #007bff; }
        .btn-success { background-color: #28a745; }
        .btn-warning { background-color: #ffc107; color: black; }
        .btn-danger { background-color: #dc3545; }
        .hidden { display: none; }
        #log-area { background: #333; color: #fff; padding: 15px; border-radius: 8px; height: 150px; overflow-y: auto; font-family: monospace; }
        .log-msg { margin: 5px 0; }
        .success { color: #4caf50; }
        .error { color: #f44336; }
    </style>
</head>
<body>

    <h1>Bypass Anime dekho</h1>

    <div class="section" id="interactive-section">
        <p>Automatically fetches the target shortlink and redirects you.</p>
        <div class="input-group hidden" id="fallback-input-group">
            <label for="target-url" style="display:block; margin-bottom:5px; font-size: 14px;">Fallback URL (automatically appends movie-hindi/cars/):</label>
            <input type="text" id="target-url" placeholder="e.g. https://example.com">
        </div>
        <button id="btn-start" class="btn-primary">Start Bypass</button>
        <button id="btn-execute" class="btn-warning hidden">Redirect Now</button>
    </div>

    <div class="section" id="log-section">
        <h2>Status Logs</h2>
        <div id="log-area"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/script.js"></script>
</body>
</html>
